name: Build & Release Spytify (Windows, Android APK, iOS)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Triggers on new release tag like v0.1.0

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. BUILD WINDOWS (.exe & .msi)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Spytify ${{ github.ref_name }}'
          releaseBody: 'Phiên bản Spytify cho Windows, Android và iOS.'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spytify-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ─────────────────────────────────────────────────────────────
  # 2. BUILD ANDROID (.apk)
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Build-Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Initialize & Build Android APK
        run: |
          npx tauri android init --ci
          npx tauri android build --apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spytify-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # ─────────────────────────────────────────────────────────────
  # 3. BUILD IOS (Xcode Project / IPA)
  # ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        run: npm ci

      - name: Initialize & Build iOS
        run: |
          npx tauri ios init --ci
          npx tauri ios build --no-signing

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spytify-iOS-Package
          path: src-tauri/gen/ios/build/**/*.ipa
