name: Build & Release Spytify (Windows, macOS DMG)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Triggers on new release tag like v0.1.0

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. BUILD WINDOWS (.exe & .msi)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Spytify v__VERSION__'
          releaseBody: 'Phiên bản Spytify chính thức cho Windows và macOS.'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spytify-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ─────────────────────────────────────────────────────────────
  # 2. BUILD MACOS (.dmg & .app Universal: Apple Silicon & Intel)
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (DMG & APP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable & macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Application & DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Spytify v__VERSION__'
          releaseBody: 'Phiên bản Spytify chính thức cho Windows và macOS (Apple Silicon M1/M2/M3/M4 & Intel).'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spytify-macOS-Universal-Package
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app

  # ─────────────────────────────────────────────────────────────
  # 3. BUILD ANDROID (.apk - Optional)
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Build-Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Initialize & Build Android APK
        run: |
          npx tauri android init --ci
          npx tauri android build --apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spytify-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
